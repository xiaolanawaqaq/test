<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>合兵塔防 · 三人联机</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;height:100dvh;background:#1a1d29;color:#e8ebf0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;width:100%;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button,input{font:inherit}
  button{border:none;border-radius:10px;background:#3b82f6;color:#fff;font-weight:700;min-height:44px;padding:10px 16px;cursor:pointer;touch-action:manipulation}
  button.secondary{background:#2c3244}
  button:disabled{background:#3a4157;color:#6b7488;cursor:default}
  input{width:100%;min-height:44px;border-radius:10px;border:1px solid #3a4157;background:#12151c;color:#e8ebf0;padding:10px 12px}
  .panel{max-width:520px;width:min(96vw,520px);margin:auto;background:#232838;border:1px solid #3a4157;border-radius:16px;padding:18px;display:none}
  .panel.active{display:block}
  .panel h1{font-size:22px;margin-bottom:8px}
  .panel p,.muted{color:#8b93a7;font-size:13px;line-height:1.5}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .row > *{flex:1}
  .status{margin-top:10px;font-size:13px;color:#4fd1ff}
  .err{margin-top:10px;font-size:13px;color:#f43f5e;min-height:18px}
  .players{display:grid;gap:8px;margin-top:12px}
  .player{display:flex;justify-content:space-between;align-items:center;background:#12151c;border-radius:10px;padding:10px 12px}
  .player .tag{font-size:12px;color:#8b93a7}
  .codeBox{background:#12151c;border-radius:10px;padding:12px;margin-top:10px}
  .codeBox strong{font-size:24px;letter-spacing:3px;color:#7ee787}
  .link{font-size:12px;word-break:break-all;color:#b6bccb;margin-top:6px}
  #stage{display:none;flex-direction:column;width:min(960px,100%);height:100%;margin:0 auto}
  #stage.active{display:flex}
  #hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:#232838;border-bottom:2px solid #3a4157}
  #hud .stat{display:flex;gap:4px;align-items:center;white-space:nowrap}
  #hud .lbl{color:#8b93a7;font-size:11px}
  #hud .val{font-weight:700}
  #playersBar{width:100%;display:flex;gap:6px;flex-wrap:wrap}
  #playersBar .chip{background:#12151c;border-radius:999px;padding:4px 10px;font-size:12px}
  #canvasBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#12151c}
  canvas{width:100%;height:auto;max-height:100%;background:#20242f;touch-action:none;display:block}
  #tray{min-height:96px;max-height:28vh;background:#232838;border-top:2px solid #3a4157;display:flex;align-items:center;padding:6px 10px;gap:8px}
  #tray .title{color:#8b93a7;font-size:11px;writing-mode:vertical-lr}
  #trayItems{display:flex;gap:8px;overflow-x:auto;flex:1;align-items:center;touch-action:pan-x}
  .trayTroop{width:76px;min-height:84px;border-radius:10px;background:#2c3244;border:2px solid #4fd1ff;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;padding:4px;flex:0 0 auto}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:40}
  #msg .box{background:rgba(20,23,34,.96);border:2px solid #3b82f6;border-radius:14px;padding:22px;width:min(92vw,420px);text-align:center}
  #msg h2{margin-bottom:8px}
  #msg p{color:#b6bccb;margin-bottom:14px}
  #conn{position:fixed;left:10px;bottom:10px;font-size:12px;color:#8b93a7;z-index:20}
</style>
</head>
<body>
<div id="app">
  <div id="home" class="panel active">
    <h1>合兵塔防 · 三人联机</h1>
    <p>三人各自手机联网，共用路线、妖怪和水晶。先创建房间，再让朋友用房间码或邀请链接加入。</p>
    <div class="row"><input id="nameInput" maxlength="20" placeholder="你的昵称（可选）"></div>
    <div class="row">
      <button id="btnCreate">创建房间</button>
      <button id="btnSolo" class="secondary" type="button">返回单机</button>
    </div>
    <div class="row">
      <input id="codeInput" maxlength="8" placeholder="输入6位房间码">
      <button id="btnJoin" class="secondary">加入房间</button>
    </div>
    <div class="status" id="homeStatus">连接中…</div>
    <div class="err" id="homeErr"></div>
  </div>

  <div id="lobby" class="panel">
    <h1>房间大厅</h1>
    <div class="codeBox">
      <div class="muted">房间码</div>
      <strong id="roomCode">------</strong>
      <div class="link" id="inviteLink"></div>
    </div>
    <div class="row">
      <button id="btnCopyCode" class="secondary">复制房间码</button>
      <button id="btnCopyLink" class="secondary">复制邀请链接</button>
    </div>
    <div class="players" id="playerList"></div>
    <p class="muted" id="startHint" style="margin-top:10px">流程：所有人点「准备」→ 房主点「开始游戏」（1～3 人都能开）</p>
    <div class="row">
      <button id="btnReady">准备</button>
      <button id="btnStart" disabled>开始游戏</button>
    </div>
    <div class="row">
      <button id="btnLeave" class="secondary">离开房间</button>
    </div>
    <div class="status" id="lobbyStatus"></div>
    <div class="err" id="lobbyErr"></div>
  </div>

  <div id="stage">
    <div id="hud">
      <div class="stat"><span class="lbl">关卡</span><span class="val" id="uiLevel">1</span></div>
      <div class="stat"><span class="lbl">妖怪</span><span class="val" id="uiWave">0/20</span></div>
      <div class="stat"><span class="lbl">水晶</span><span class="val" id="uiCrystals">10</span></div>
      <div class="stat"><span class="lbl">阶段</span><span class="val" id="uiPhase">备战</span></div>
      <div class="stat"><span class="lbl">倒计时</span><span class="val" id="uiTimer">--</span></div>
      <div id="playersBar"></div>
      <button id="btnWave" disabled style="margin-left:auto">开始进攻</button>
    </div>
    <div id="canvasBox"><canvas id="gameCanvas" width="960" height="576"></canvas></div>
    <div id="tray">
      <div class="title">我的待命</div>
      <div id="trayItems"></div>
    </div>
  </div>
</div>

<div id="msg"><div class="box"><h2 id="msgTitle"></h2><p id="msgText"></p><div class="row"><button id="msgRematch">再来一局</button><button id="msgHome" class="secondary">回大厅</button></div></div></div>
<div id="conn">离线</div>

<script src="/client/network-client.js"></script>
<script>
"use strict";

const CV_W=960, CV_H=576, CELL=64, MAX_LEVEL=6, WAVE_SIZE=20, START_CRYSTALS=10;
const LEVEL_COLORS=["#ffffff","#7ee787","#4fd1ff","#c084fc","#fb923c","#f43f5e"];
const PATH=[{x:40,y:70},{x:860,y:70},{x:860,y:180},{x:100,y:180},{x:100,y:290},{x:860,y:290},{x:860,y:400},{x:100,y:400},{x:100,y:510},{x:520,y:510}];
const SLOTS=[];
(function(){
  const bandY=[125,235,345,455], startX=150, gap=CELL+6, cols=8;
  bandY.forEach(y=>{ for(let c=0;c<cols;c++) SLOTS.push({x:startX+c*gap,y,troop:null}); });
})();

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const trayEl=document.getElementById("trayItems");
const ui={
  home:document.getElementById("home"),
  lobby:document.getElementById("lobby"),
  stage:document.getElementById("stage"),
  homeStatus:document.getElementById("homeStatus"),
  homeErr:document.getElementById("homeErr"),
  lobbyStatus:document.getElementById("lobbyStatus"),
  lobbyErr:document.getElementById("lobbyErr"),
  roomCode:document.getElementById("roomCode"),
  inviteLink:document.getElementById("inviteLink"),
  playerList:document.getElementById("playerList"),
  btnReady:document.getElementById("btnReady"),
  btnStart:document.getElementById("btnStart"),
  conn:document.getElementById("conn"),
  level:document.getElementById("uiLevel"),
  wave:document.getElementById("uiWave"),
  crystals:document.getElementById("uiCrystals"),
  phase:document.getElementById("uiPhase"),
  timer:document.getElementById("uiTimer"),
  playersBar:document.getElementById("playersBar"),
  btnWave:document.getElementById("btnWave"),
  msg:document.getElementById("msg"),
  msgTitle:document.getElementById("msgTitle"),
  msgText:document.getElementById("msgText"),
};

const me={id:null, name:""};
let room=null;
let state=null;
let lastRevision=-1;
let localTray=[];
const drag={active:false,troop:null,from:null,mx:0,my:0,pointerId:null};
const ghostEl=document.createElement("div");
ghostEl.style.cssText="position:fixed;pointer-events:none;z-index:80;display:none;width:72px;height:72px;border-radius:12px;background:rgba(44,50,68,.95);border:2px solid #4fd1ff;align-items:center;justify-content:center;flex-direction:column;transform:translate(-50%,-60%)";
document.body.appendChild(ghostEl);

function setScreen(name){
  ui.home.classList.toggle("active", name==="home");
  ui.lobby.classList.toggle("active", name==="lobby");
  ui.stage.classList.toggle("active", name==="stage");
  if(name==="stage") ui.stage.style.display="flex";
  else ui.stage.style.display="none";
}
function showErr(where,msg){ (where==="home"?ui.homeErr:ui.lobbyErr).textContent=msg||""; }
function inviteUrl(token){
  const u=new URL(location.href);
  u.searchParams.set("room", token);
  return u.toString();
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  return Promise.resolve();
}

const net=new NetworkClient({
  onStatus(s){
    ui.conn.textContent = s==="connected"?"已连接服务器":(s==="connecting"?"连接中…":"离线");
    ui.homeStatus.textContent = s==="connected"?"已连接，可以创建/加入房间":(s==="connecting"?"正在连接服务器…":"服务器未连接");
  },
  onError(msg){ showErr(room?"lobby":"home", msg); },
  onMessage(msg){
    if(msg.type==="hello"){ me.id=msg.playerId; return; }
    if(msg.type==="error"){ showErr(room?"lobby":"home", msg.message); return; }
    if(msg.type==="room"){
      room=msg;
      renderLobby();
      if(msg.state) applyState(msg.state);
      if(msg.state && msg.state.started) setScreen("stage");
      else setScreen("lobby");
      return;
    }
    if(msg.type==="state"){
      applyState(msg.state);
      if(msg.state && msg.state.started) setScreen("stage");
      if(msg.state && msg.state.over) showResult(msg.state);
      return;
    }
    if(msg.type==="left"){
      room=null; state=null; setScreen("home");
    }
  }
});

function renderLobby(){
  if(!room) return;
  ui.roomCode.textContent=room.roomCode||"------";
  ui.inviteLink.textContent=inviteUrl(room.inviteToken);
  ui.playerList.innerHTML="";
  (room.players||[]).forEach((p,i)=>{
    const el=document.createElement("div");
    el.className="player";
    const role=p.id===room.hostId?"房主":("玩家"+(i+1));
    el.innerHTML=`<div><div>${p.name||p.id}${p.id===me.id?"（我）":""}</div><div class="tag">${role} · ${p.connected?"在线":"离线"}</div></div><div class="tag">${p.ready?"已准备":"未准备"}</div>`;
    ui.playerList.appendChild(el);
  });
  const meP=(room.players||[]).find(p=>p.id===me.id);
  ui.btnReady.textContent=meP&&meP.ready?"取消准备":"准备";
  const players=room.players||[];
  const allReady=players.length>=1 && players.every(p=>p.ready);
  const isHost=room.hostId===me.id;
  // 房主在全员准备后可点；非房主始终灰掉但文案说明原因
  ui.btnStart.disabled=!(isHost && allReady);
  ui.btnStart.textContent = isHost ? "开始游戏" : "等待房主开始";
  let tip=`${players.length}/3 人`;
  if(!allReady) tip += " · 请所有人先点准备";
  else if(!isHost) tip += " · 已齐，等房主点开始";
  else tip += " · 可以开始了，点右侧「开始游戏」";
  ui.lobbyStatus.textContent=tip;
  const hint=document.getElementById("startHint");
  if(hint){
    if(!isHost) hint.textContent="你不是房主：准备后等房主点「开始游戏」";
    else if(!allReady) hint.textContent="你是房主：等所有人准备后，「开始游戏」会变亮";
    else hint.textContent="全员已准备 → 点「开始游戏」进入战场";
  }
}

function applyState(s){
  if(!s) return;
  state=s;
  lastRevision=s.revision;
  localTray=s.tray||[];
  // slots
  for(let i=0;i<SLOTS.length;i++){
    const t=s.slots&&s.slots[i];
    SLOTS[i].troop=t?{...t,type:{name:t.name,icon:t.icon,tag:t.tag,desc:t.desc},mode:t.mode,range:t.range||110}:null;
  }
  try{ tickSfxFromState(s); }catch(e){}
  renderTray();
  updateHUD();
}

function updateHUD(){
  if(!state) return;
  ui.level.textContent=state.level;
  ui.wave.textContent=`${state.killed||0}/${state.waveSize||WAVE_SIZE}`;
  ui.crystals.textContent=state.crystals;
  ui.phase.textContent=state.phase==="prep"?"备战":(state.phase==="battle"?"进攻":state.phase);
  if(state.phase==="prep"){
    const sec=Math.max(0,Math.ceil(state.prepTimer||0));
    ui.timer.textContent=String((sec/60|0)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
  } else ui.timer.textContent="—";
  ui.playersBar.innerHTML="";
  (state.players||[]).forEach(p=>{
    const chip=document.createElement("div");
    chip.className="chip";
    chip.textContent=`${p.name}${p.id===me.id?"(我)":""}${p.connected?"":" 离线"}`;
    ui.playersBar.appendChild(chip);
  });
  // 备战阶段：房主可提前开始进攻；进攻中禁用
  const isHost = !!(room && room.hostId===me.id) || !!(state && state.hostId===me.id);
  if(ui.btnWave){
    if(state.over){
      ui.btnWave.disabled=true;
      ui.btnWave.textContent="已结束";
    } else if(state.phase==="prep"){
      ui.btnWave.disabled=!isHost;
      ui.btnWave.textContent=isHost?"开始进攻":"等待房主进攻";
    } else if(state.phase==="battle"){
      ui.btnWave.disabled=true;
      ui.btnWave.textContent="进攻中";
    } else {
      ui.btnWave.disabled=true;
      ui.btnWave.textContent="开始进攻";
    }
  }
}

function renderTray(){
  trayEl.innerHTML="";
  localTray.forEach(tr=>{
    const el=document.createElement("div");
    el.className="trayTroop";
    el.dataset.id=tr.id;
    const border=LEVEL_COLORS[(tr.level||1)-1]||"#fff";
    el.style.borderColor=border;
    el.innerHTML=`<div style="font-size:20px;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))">${tr.icon||"🤖"}</div><div style="font-size:11px;pointer-events:none">${tr.name||""}</div><div style="font-size:9px;color:#8b93a7;pointer-events:none">${tr.desc||tr.tag||""}</div>`;
    trayEl.appendChild(el);
  });
}

function showResult(s){
  ui.msg.style.display="flex";
  if(s.result==="win"){ ui.msgTitle.textContent="通关！"; ui.msgText.textContent=`三人合力守住 40 关，剩余水晶 ${s.crystals}`; }
  else { ui.msgTitle.textContent="失败"; ui.msgText.textContent=`水晶耗尽，坚持到第 ${s.level} 关`; }
}

function clientToCanvas(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  if(r.width<=0||r.height<=0) return {x:0,y:0};
  return {x:(clientX-r.left)*(CV_W/r.width), y:(clientY-r.top)*(CV_H/r.height)};
}
function slotAt(x,y){
  for(let i=0;i<SLOTS.length;i++){
    const s=SLOTS[i];
    if(Math.abs(x-s.x)<40 && Math.abs(y-s.y)<40) return {slot:s,index:i};
  }
  return null;
}

function shadeColor(col, pct){
  if(typeof col==="string" && col.startsWith("hsl")){
    const m=col.match(/hsl\(([-\d.]+),\s*([\d.]+)%,\s*([\d.]+)%\)/);
    if(m){
      const h=+m[1], s=+m[2], l=Math.max(5, Math.min(90, +m[3]+pct*0.4));
      return `hsl(${h},${s}%,${l}%)`;
    }
  }
  if(typeof col==="string" && col[0]==="#" && col.length===7){
    const n=parseInt(col.slice(1),16);
    let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=Math.max(0,Math.min(255, r+pct));
    g=Math.max(0,Math.min(255, g+pct));
    b=Math.max(0,Math.min(255, b+pct));
    return `rgb(${r|0},${g|0},${b|0})`;
  }
  return col;
}
// 15 种兵各自不同造型
function drawTroopAt(x, y, tr, alpha){
  const a = alpha==null ? 1 : alpha;
  const name = tr.name||tr.type?.name||"";
  const mode = tr.mode||"single";
  const style = tr.style||"";
  const key = tr.typeKey || tr.key || style;
  const lv = (tr.level||1)-1;
  const ring = LEVEL_COLORS[lv]||"#fff";
  const t = (typeof performance!=="undefined" ? performance.now() : 0)/1000;
  ctx.save();
  ctx.globalAlpha = a;
  if(tr.range){
    ctx.beginPath(); ctx.arc(x,y,tr.range,0,Math.PI*2);
    ctx.fillStyle = mode==="aoe" ? "rgba(251,146,60,.045)" : "rgba(79,209,255,.035)";
    ctx.fill();
  }
  ctx.save();
  ctx.translate(x,y); ctx.scale(1.3,1.3); ctx.translate(-x,-y);
  ctx.beginPath(); ctx.ellipse(x, y+12, 12, 4.5, 0, 0, Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,.4)"; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y+9, 10.5, 0, Math.PI*2);
  ctx.fillStyle="rgba(20,24,36,.88)"; ctx.fill();
  ctx.strokeStyle=ring; ctx.lineWidth=2; ctx.stroke();

  function mecha(bodyTop, bodyBot, gunColor, eyeColor, gunLen, wide){
    const g=ctx.createLinearGradient(x-8,y-10,x+8,y+8);
    g.addColorStop(0,bodyTop); g.addColorStop(0.5,bodyBot); g.addColorStop(1,shadeColor(bodyBot,-25));
    ctx.strokeStyle=shadeColor(bodyBot,-20); ctx.lineWidth=2.2; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(x-3,y+2); ctx.lineTo(x-6-(wide?1:0),y+10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+3,y+2); ctx.lineTo(x+6+(wide?1:0),y+10); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x-7-(wide?1:0),y+2); ctx.lineTo(x-6,y-8); ctx.lineTo(x+6,y-8); ctx.lineTo(x+7+(wide?1:0),y+2);
    ctx.closePath(); ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle="#1f2a36"; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x-6,y-6,3.5,2.5,0,0,Math.PI*2); ctx.fillStyle=bodyTop; ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+6,y-6,3.5,2.5,0,0,Math.PI*2); ctx.fillStyle=bodyTop; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y-11, 4.2, 0, Math.PI*2);
    ctx.fillStyle=bodyTop; ctx.fill(); ctx.strokeStyle="#2a3644"; ctx.stroke();
    ctx.fillStyle=eyeColor||ring; ctx.fillRect(x-2.5, y-12, 5, 2);
    ctx.strokeStyle=gunColor||"#cfd8e3"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x+6,y-3); ctx.lineTo(x+(gunLen||14),y-5); ctx.stroke();
    ctx.fillStyle=eyeColor||ring; ctx.beginPath(); ctx.arc(x+(gunLen||14),y-5,1.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y-2, 1.8, 0, Math.PI*2); ctx.fillStyle=ring; ctx.fill();
  }
  function tankBody(hull, turret, barrel){
    ctx.fillStyle=hull;
    ctx.beginPath(); ctx.rect(x-11,y-2,22,10); ctx.fill();
    ctx.strokeStyle="#1a2030"; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=turret;
    ctx.beginPath(); ctx.ellipse(x, y-4, 7, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle=barrel; ctx.lineWidth=3; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(x+5,y-5); ctx.lineTo(x+15,y-7); ctx.stroke();
    ctx.fillStyle=ring; ctx.beginPath(); ctx.arc(x,y-4,2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#334155"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x-10,y+8); ctx.lineTo(x+10,y+8); ctx.stroke();
  }
  function jet(bodyA, bodyB, flame, wingSpan){
    const bob = Math.sin(t*4 + x*0.05)*1.2;
    const py = y-4+bob;
    const g=ctx.createLinearGradient(x-10,py,x+10,py);
    g.addColorStop(0,bodyB); g.addColorStop(0.5,bodyA); g.addColorStop(1,bodyB);
    ctx.beginPath();
    ctx.moveTo(x+12,py); ctx.lineTo(x+2,py-4); ctx.lineTo(x-10,py-2);
    ctx.lineTo(x-12,py); ctx.lineTo(x-10,py+2); ctx.lineTo(x+2,py+4);
    ctx.closePath(); ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle="#1a2430"; ctx.lineWidth=1; ctx.stroke();
    const ws=wingSpan||8;
    ctx.beginPath(); ctx.moveTo(x-1,py); ctx.lineTo(x-6,py-ws); ctx.lineTo(x+4,py-2); ctx.closePath();
    ctx.fillStyle=bodyA; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x-1,py); ctx.lineTo(x-6,py+ws); ctx.lineTo(x+4,py+2); ctx.closePath();
    ctx.fillStyle=bodyB; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x-12,py); ctx.lineTo(x-17,py-2); ctx.lineTo(x-17,py+2); ctx.closePath();
    ctx.fillStyle=flame; ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+4,py-1,3,2,0,0,Math.PI*2); ctx.fillStyle=ring; ctx.fill();
  }
  function tower(base, top, accent){

    ctx.beginPath(); ctx.arc(x,y-8,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(x,y-8,2.5,0,Math.PI*2); ctx.fill();

// 虫子造型
function drawEnemyAt(e){
  const r = e.bodyR || 11;
  const x=e.x, y=e.y;
  const kind = e.kind || "mite";
  const body = e.color || "#7a3f6a";
  const shell = e.shell || shadeColor(body, -30);
  const eye = e.eye || "#c4f042";
  const wob = Math.sin((e.walk||0)) * 0.18;
  ctx.save();
  ctx.translate(x,y); ctx.scale(1.15,1.15); ctx.translate(-x,-y);
  ctx.beginPath(); ctx.ellipse(x, y+r*0.55, r*0.95, r*0.32, 0, 0, Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,.4)"; ctx.fill();
  ctx.translate(x, y-2);
  ctx.rotate(wob);
  if(kind==="flyer"){
    ctx.beginPath(); ctx.ellipse(0,0,r*0.95,r*0.65,0,0,Math.PI*2);
    const g=ctx.createRadialGradient(-r*0.3,-r*0.3,1,0,0,r);
    g.addColorStop(0, body); g.addColorStop(1, shell);
    ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle="#1a1020"; ctx.lineWidth=1; ctx.stroke();
    ctx.globalAlpha=0.55;
    ctx.beginPath(); ctx.ellipse(-r*0.2,-r*0.7,r*0.7,r*0.35,-0.6,0,Math.PI*2);
    ctx.fillStyle="#c4b5fd"; ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.2,-r*0.7,r*0.7,r*0.35,0.6,0,Math.PI*2);
    ctx.fillStyle="#a78bfa"; ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=eye;
    ctx.beginPath(); ctx.arc(-r*0.25,-r*0.1,1.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.25,-r*0.1,1.6,0,Math.PI*2); ctx.fill();
  } else if(kind==="spider"){
    const legPhase=e.walk||0;
    ctx.strokeStyle=shell; ctx.lineWidth=1.6; ctx.lineCap="round";
    for(let i=0;i<6;i++){
      const side=i<3?-1:1;
      const idx=i%3;
      const ang = side*(0.5+idx*0.45) + Math.sin(legPhase+idx)*0.15;
      const lx=Math.cos(ang)*r*1.55*side*0.85;
      const ly=Math.sin(Math.abs(ang))*r*0.9 + Math.sin(legPhase*2+idx)*1.2;
      ctx.beginPath(); ctx.moveTo(side*r*0.35,0); ctx.lineTo(lx,ly); ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(0,r*0.15,r*0.85,r*0.7,0,0,Math.PI*2);
    const g=ctx.createRadialGradient(-2,-3,1,0,0,r);
    g.addColorStop(0,"#f0d56a"); g.addColorStop(0.55,body); g.addColorStop(1,shell);
    ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle="#3a1a10"; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle="#ef4444";
    ctx.beginPath(); ctx.ellipse(0,r*0.1,r*0.28,r*0.2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=eye;
    ctx.beginPath(); ctx.arc(-r*0.28,-r*0.25,1.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.28,-r*0.25,1.5,0,Math.PI*2); ctx.fill();
  } else if(kind==="beetle"){
    ctx.beginPath(); ctx.ellipse(0,0,r*0.95,r*0.75,0,0,Math.PI*2);
    const g=ctx.createRadialGradient(-r*0.2,-r*0.3,1,0,0,r);
    g.addColorStop(0,"#e0a46a"); g.addColorStop(0.5,body); g.addColorStop(1,shell);
    ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle="#3a2410"; ctx.lineWidth=1; ctx.stroke();
    ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.moveTo(0,-r*0.6); ctx.lineTo(0,r*0.55); ctx.stroke();
    ctx.strokeStyle=shell; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(-r*0.4,r*0.2); ctx.lineTo(-r*1.1,r*0.55); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.4,r*0.2); ctx.lineTo(r*1.1,r*0.55); ctx.stroke();
    ctx.fillStyle=eye;
    ctx.beginPath(); ctx.arc(-r*0.28,-r*0.1,1.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.28,-r*0.1,1.5,0,Math.PI*2); ctx.fill();
  } else {
    const legPhase=e.walk||0;
    ctx.strokeStyle=shell; ctx.lineWidth=1.4; ctx.lineCap="round";
    for(let i=0;i<4;i++){
      const ang=-0.8+i*0.5 + Math.sin(legPhase+i)*0.12;
      ctx.beginPath();
      ctx.moveTo(-r*0.4, r*0.1);
      ctx.lineTo(-r*1.15*Math.cos(ang*0.3), r*0.35+Math.sin(legPhase+i)*1.5+i);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(r*0.4, r*0.1);
      ctx.lineTo(r*1.15*Math.cos(ang*0.3), r*0.35+Math.sin(legPhase+i+1)*1.5+i);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(0,0,r*0.9,r*0.8,0,0,Math.PI*2);
    const g=ctx.createRadialGradient(-r*0.25,-r*0.3,1,0,0,r);
    g.addColorStop(0,"#b56a9a"); g.addColorStop(0.5,body); g.addColorStop(1,shell);
    ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle="#2a1020"; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=shell;
    for(let i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.moveTo(i*r*0.22, -r*0.55);
      ctx.lineTo(i*r*0.22+1.2, -r*0.95);
      ctx.lineTo(i*r*0.22+2.4, -r*0.5);
      ctx.fill();
    }
    ctx.fillStyle=eye;
    ctx.beginPath(); ctx.arc(-r*0.25,r*0.05,1.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.25,r*0.05,1.6,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function draw(){
  try{
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,CV_W,CV_H);
  ctx.fillStyle="#1c2030"; ctx.fillRect(0,0,CV_W,CV_H);
  ctx.lineWidth=48; ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.strokeStyle="#2a3040";
  ctx.beginPath(); ctx.moveTo(PATH[0].x,PATH[0].y);
  for(let i=1;i<PATH.length;i++) ctx.lineTo(PATH[i].x,PATH[i].y);
  ctx.stroke();
  ctx.lineWidth=36; ctx.strokeStyle="#333b4f"; ctx.stroke();
  // cave
  ctx.beginPath(); ctx.ellipse(PATH[0].x,PATH[0].y,28,34,0,0,Math.PI*2);
  ctx.fillStyle="#0d0f16"; ctx.fill();
  // slots
  for(const s of SLOTS){
    if(!s.troop){
      ctx.strokeStyle="rgba(120,130,160,.22)"; ctx.lineWidth=2; ctx.setLineDash([5,5]);
      ctx.strokeRect(s.x-26,s.y-26,52,52); ctx.setLineDash([]);
    }
  }
  // crystals
  const end=PATH[PATH.length-1];
  const crystals=state?state.crystals:START_CRYSTALS;
  for(let i=0;i<START_CRYSTALS;i++){
    const cx=end.x-90+(i%5)*40, cy=end.y-14+((i/5)|0)*30, alive=i<crystals;
    ctx.beginPath(); ctx.moveTo(cx,cy-10); ctx.lineTo(cx+8,cy); ctx.lineTo(cx,cy+10); ctx.lineTo(cx-8,cy); ctx.closePath();
    ctx.fillStyle=alive?"#4fd1ff":"#2b3140"; ctx.fill();
  }
  // poison clouds
  for(const c of (state&&state.clouds)||[]){
    const a=Math.min(0.35, (c.life||1)*0.12);
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(132,204,22,${a})`; ctx.fill();
    ctx.strokeStyle=`rgba(163,230,53,${a+0.2})`; ctx.lineWidth=1.5; ctx.stroke();
  }
  // effects
  for(const ef of (state&&state.effects)||[]){
    const a=Math.max(0.1, (ef.life||0.1)/(ef.max||0.2));
    if(ef.kind==="ring"){
      ctx.beginPath(); ctx.arc(ef.x,ef.y,(ef.r||40)*(1.05-a*0.2),0,Math.PI*2);
      ctx.strokeStyle=ef.color||"#fb923c"; ctx.globalAlpha=a*0.8; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1;
    } else if(ef.kind==="laser"){
      ctx.beginPath(); ctx.moveTo(ef.x1,ef.y1); ctx.lineTo(ef.x2,ef.y2);
      ctx.strokeStyle=ef.color||"#f43f5e"; ctx.globalAlpha=a; ctx.lineWidth=ef.width||2; ctx.stroke(); ctx.globalAlpha=1;
    } else if(ef.kind==="cone"){
      ctx.beginPath(); ctx.moveTo(ef.x,ef.y);
      ctx.arc(ef.x,ef.y,ef.r||60,ef.ang-ef.half,ef.ang+ef.half); ctx.closePath();
      ctx.fillStyle=`rgba(251,146,60,${a*0.35})`; ctx.fill();
    }
  }
  // beams
  for(const b of (state&&state.beams)||[]){
    const a=Math.min(1,(b.life||0.2)*3);
    ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.tx,b.ty);
    ctx.strokeStyle=`rgba(79,209,255,${a*0.9})`; ctx.lineWidth=3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.tx,b.ty);
    ctx.strokeStyle=`rgba(255,255,255,${a*0.5})`; ctx.lineWidth=1; ctx.stroke();
  }
  // troops（更小 + 阴影立体感）
  for(const s of SLOTS){
    const tr=s.troop; if(!tr) continue;
    drawTroopAt(s.x,s.y,tr,1);
    if(tr.ownerId===me.id){
      ctx.font="9px sans-serif"; ctx.fillStyle="#7ee787"; ctx.textAlign="center";
      ctx.fillText("我的", s.x, s.y+39);
    } else {
      ctx.font="9px sans-serif"; ctx.fillStyle="#8b93a7"; ctx.textAlign="center";
      ctx.fillText("队友", s.x, s.y+39);
    }
  }
  // enemies（更小 + 阴影立体感，沿路径走动）
  const enemies=state?state.enemies:[];
  for(const e of enemies){
    drawEnemyAt(e);
    if(e.slow){
      ctx.beginPath(); ctx.arc(e.x,e.y-2,(e.bodyR||11)+3,0,Math.PI*2);
      ctx.strokeStyle="rgba(125,211,252,.8)"; ctx.lineWidth=2; ctx.stroke();
    }
    if(e.poison){
      ctx.beginPath(); ctx.arc(e.x,e.y-2,(e.bodyR||11)+4,0,Math.PI*2);
      ctx.strokeStyle="rgba(132,204,22,.7)"; ctx.lineWidth=2; ctx.stroke();
    }
    const w=26,h=3,p=Math.max(0,e.hp/e.hpMax);
    const barY=e.y-(e.bodyR||11)-12;
    ctx.fillStyle="#111"; ctx.fillRect(e.x-w/2,barY,w,h);
    ctx.fillStyle=p>0.5?"#7ee787":p>0.25?"#fbbf24":"#f43f5e";
    ctx.fillRect(e.x-w/2,barY,w*p,h);
  }
  // bullets
  for(const b of (state&&state.bullets)||[]){
    ctx.globalAlpha=0.85;
    ctx.beginPath(); ctx.moveTo(b.sx,b.sy); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=b.color||"#ffe58a"; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x,b.y,b.size||3,0,Math.PI*2);
    ctx.fillStyle=b.color||"#ffe58a"; ctx.fill();
  }
  ctx.globalAlpha=1;
  // drag ghost on canvas
  if(drag.active && drag.troop){
    const tr=drag.troop;
    drawTroopAt(drag.mx, drag.my, tr, 0.92);
    const hit=slotAt(drag.mx,drag.my);
    if(hit){
      const fromTray=drag.from && drag.from.type==="tray";
      const tgt=hit.slot.troop;
      const canMerge=tgt && tgt.id!==tr.id && tgt.ownerId===me.id && tgt.level===tr.level && tr.level<MAX_LEVEL;
      const canPlace=!tgt && fromTray;
      ctx.strokeStyle=canMerge?"#7ee787":(canPlace?"#4fd1ff":"#f43f5e");
      ctx.lineWidth=3; ctx.strokeRect(hit.slot.x-28,hit.slot.y-28,56,56);
      ctx.font="12px sans-serif";
      if(canMerge){
        ctx.fillStyle="#7ee787";
        ctx.fillText("合成→随机造型", hit.slot.x, hit.slot.y-40);
      } else if(!tgt && !fromTray){
        ctx.fillStyle="#f43f5e";
        ctx.fillText("只能合成，不能移动", hit.slot.x, hit.slot.y-40);
      }
    }
  }
  }catch(err){
    console.error("draw error", err);
    try{ ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle="#1c2030"; ctx.fillRect(0,0,CV_W,CV_H); }catch(_){}
  }
}

// ============ 音效 + 简单背景音乐 ============
let actx=null, bgmOn=false;
function initAudio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==="suspended") actx.resume().catch(()=>{});
  startBgm();
}
window.addEventListener("pointerdown", initAudio, {once:true});
function startBgm(){
  if(!actx || bgmOn) return;
  bgmOn=true;
  try{
    const master=actx.createGain();
    master.gain.value=0.035;
    master.connect(actx.destination);
    const bufLen=actx.sampleRate*2;
    const noiseBuf=actx.createBuffer(1, bufLen, actx.sampleRate);
    const data=noiseBuf.getChannelData(0);
    for(let i=0;i<bufLen;i++) data[i]=(Math.random()*2-1)*0.15;
    const noise=actx.createBufferSource();
    noise.buffer=noiseBuf; noise.loop=true;
    const nf=actx.createBiquadFilter();
    nf.type="lowpass"; nf.frequency.value=220;
    const ng=actx.createGain(); ng.gain.value=0.35;
    noise.connect(nf); nf.connect(ng); ng.connect(master);
    noise.start();
    [98,146.8].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.value=0.25-i*0.08;
      o.connect(g); g.connect(master); o.start();
    });
  }catch(e){ bgmOn=false; }
}
let sfxGate=0;
const STYLE_SOUND={
  rapid:"gun", heavy:"tank", splash:"rocket", sniper:"gun", cone:"robot",
  chain:"robot", beam:"gun", freeze:"robot", poison:"gun", missile:"rocket",
  shotgun:"gun", pulse:"robot"
};
function playSfx(kind){
  if(!actx) return;
  const now=actx.currentTime;
  if(now<sfxGate) return;
  sfxGate=now+0.03;
  const o=actx.createOscillator(), g=actx.createGain();
  o.connect(g); g.connect(actx.destination);
  let f=440, dur=0.08, type="square", vol=0.12;
  if(kind==="gun"){ f=180; dur=0.05; type="square"; vol=0.09; }
  else if(kind==="tank"){ f=70; dur=0.22; type="sawtooth"; vol=0.18; }
  else if(kind==="robot"){ f=320; dur=0.10; type="triangle"; vol=0.11; }
  else if(kind==="rocket"){ f=520; dur=0.18; type="sine"; vol=0.13; }
  else if(kind==="deploy"){ f=360; dur=0.12; type="triangle"; vol=0.14; }
  else if(kind==="merge"){ f=660; dur=0.18; type="triangle"; vol=0.16; }
  else if(kind==="hit"){ f=140; dur=0.04; type="square"; vol=0.06; }
  else if(kind==="wave"){ f=240; dur=0.2; type="triangle"; vol=0.14; }
  o.type=type; o.frequency.setValueAtTime(f,now);
  if(kind==="tank"||kind==="rocket") o.frequency.exponentialRampToValueAtTime(Math.max(30,f*0.4),now+dur);
  if(kind==="deploy") o.frequency.exponentialRampToValueAtTime(180,now+dur);
  if(kind==="merge"||kind==="wave") o.frequency.exponentialRampToValueAtTime(f*1.8,now+dur);
  g.gain.setValueAtTime(vol,now);
  g.gain.exponentialRampToValueAtTime(0.001,now+dur);
  o.start(now); o.stop(now+dur+0.02);
}

// 根据服务器状态变化补本地音效
let prevSfx={revision:-1, killed:0, phase:null, level:1, bullets:0, crystals:10, tray:null, ownSlots:null};
function tickSfxFromState(s){
  if(!s) return;
  const trayCount=(s.tray||[]).length;
  const ownSlots=(s.slots||[]).filter(t=>t&&t.ownerId===me.id).length;
  // 只有“待命减少且自己的战场兵增加”才是成功部署；合成和失败放置不会响
  if(prevSfx.tray!==null && trayCount<prevSfx.tray && ownSlots>prevSfx.ownSlots) playSfx("deploy");
  if(s.phase==="battle" && prevSfx.phase==="prep") playSfx("wave");
  if((s.level||1)>(prevSfx.level||1)) playSfx("merge");
  // 子弹数增加 → 开火声（按 style 选音色）
  const bl=(s.bullets||[]).length;
  if(bl>prevSfx.bullets){
    const newest=(s.bullets||[])[bl-1];
    playSfx(STYLE_SOUND[newest&&newest.style]||"gun");
  }
  if((s.killed||0)>(prevSfx.killed||0)) playSfx("hit");
  if((s.crystals||0)<(prevSfx.crystals||10)) playSfx("tank");
  prevSfx={
    revision:s.revision, killed:s.killed||0, phase:s.phase,
    level:s.level||1, bullets:bl, crystals:s.crystals||0,
    tray:trayCount, ownSlots
  };
}

function loop(){
  try{
    if(document.visibilityState!=="hidden") draw();
  }catch(err){
    console.error("draw loop error", err);
  }
  requestAnimationFrame(loop);
}

// drag handlers — local preview only, command on drop
trayEl.addEventListener("pointerdown", e=>{
  initAudio();
  const el=e.target.closest(".trayTroop"); if(!el) return;
  const tr=localTray.find(t=>t.id===el.dataset.id); if(!tr) return;
  e.preventDefault(); el.setPointerCapture?.(e.pointerId);
  drag.active=true; drag.troop=tr; drag.from={type:"tray"}; drag.pointerId=e.pointerId;
  const p=clientToCanvas(e.clientX,e.clientY); drag.mx=p.x; drag.my=p.y;
  ghostEl.style.display="flex"; ghostEl.innerHTML=`<div style="font-size:26px">${tr.icon||"🤖"}</div><div style="font-size:11px">${tr.name||""}</div>`;
  ghostEl.style.left=e.clientX+"px"; ghostEl.style.top=e.clientY+"px";
});
canvas.addEventListener("pointerdown", e=>{
  initAudio();
  if(drag.active) return;
  const p=clientToCanvas(e.clientX,e.clientY);
  const hit=slotAt(p.x,p.y);
  if(hit && hit.slot.troop && hit.slot.troop.ownerId===me.id){
    e.preventDefault(); canvas.setPointerCapture?.(e.pointerId);
    drag.active=true; drag.troop=hit.slot.troop; drag.from={type:"slot",index:hit.index}; drag.pointerId=e.pointerId;
    drag.mx=p.x; drag.my=p.y;
    ghostEl.style.display="flex"; ghostEl.innerHTML=`<div style="font-size:26px">${hit.slot.troop.icon||"🤖"}</div>`;
    ghostEl.style.left=e.clientX+"px"; ghostEl.style.top=e.clientY+"px";
  }
});
window.addEventListener("pointermove", e=>{
  if(!drag.active) return;
  if(drag.pointerId!=null && e.pointerId!==drag.pointerId) return;
  const p=clientToCanvas(e.clientX,e.clientY); drag.mx=p.x; drag.my=p.y;
  ghostEl.style.left=e.clientX+"px"; ghostEl.style.top=e.clientY+"px";
});
window.addEventListener("pointerup", e=>{
  if(!drag.active) return;
  if(drag.pointerId!=null && e.pointerId!==drag.pointerId) return;
  const p=clientToCanvas(e.clientX,e.clientY);
  const hit=slotAt(p.x,p.y);
  if(hit && drag.troop){
    const fromSlot=drag.from?.type==="slot";
    // 战场兵只能合成，不能自由挪空位；待命区可部署到空位
    if(fromSlot){
      const tgt=hit.slot.troop;
      if(tgt && tgt.id!==drag.troop.id && tgt.ownerId===me.id && tgt.level===drag.troop.level && drag.troop.level<MAX_LEVEL){
        initAudio(); playSfx("merge");
        net.send("merge",{troopId:drag.troop.id,targetSlot:hit.index,sourceSlot:drag.from.index});
      }
      // 空位或其他非法目标：不发命令，服务器权威状态会保持原位
    } else {
      initAudio();
      net.send("deploy",{troopId:drag.troop.id,targetSlot:hit.index});
    }
  }
  drag.active=false; drag.troop=null; drag.from=null; drag.pointerId=null; ghostEl.style.display="none";
});
window.addEventListener("pointercancel", ()=>{
  drag.active=false; drag.troop=null; drag.from=null; drag.pointerId=null; ghostEl.style.display="none";
});
